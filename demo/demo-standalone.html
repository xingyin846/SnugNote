<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f4ef" />
  <title>贴贴便签 · Demo（单文件版）</title>
  <style>
/* ===== 贴贴便签 · 前端 Demo 排版 ===== */

:root {
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 18px;
  --radius-sm: 12px;
  --gap: 14px;
  --sidebar-w: 232px;
}

/* 主题变量 */
:root,
:root[data-theme="light"] {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --sidebar-bg: #fbfaf7;
  --text: #24212b;
  --text-soft: #6d6875;
  --border: #e8e3da;
  --shadow: 0 1px 2px rgba(30, 25, 45, 0.04), 0 6px 18px rgba(30, 25, 45, 0.06);
  --shadow-hover: 0 4px 10px rgba(30, 25, 45, 0.08), 0 14px 30px rgba(30, 25, 45, 0.10);
  --chip-bg: #efece6;
}

:root[data-theme="dark"] {
  --bg: #17171c;
  --surface: #22222a;
  --sidebar-bg: #1c1c23;
  --text: #f2f0f6;
  --text-soft: #a7a1b2;
  --border: #33333d;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.35);
  --shadow-hover: 0 4px 10px rgba(0, 0, 0, 0.4), 0 14px 30px rgba(0, 0, 0, 0.5);
  --chip-bg: #2b2b34;
}

/* 便签配色（浅） */
:root[data-theme="light"] .note--yellow { --note-bg: #fff6c9; --note-edge: #f3e18a; }
:root[data-theme="light"] .note--pink   { --note-bg: #ffe3ee; --note-edge: #f3b5cd; }
:root[data-theme="light"] .note--blue   { --note-bg: #dcefff; --note-edge: #a6d4f5; }
:root[data-theme="light"] .note--green  { --note-bg: #e3f6d0; --note-edge: #b4de95; }
:root[data-theme="light"] .note--purple { --note-bg: #ece3ff; --note-edge: #c7b8ef; }
:root[data-theme="light"] .note--orange { --note-bg: #ffe8d3; --note-edge: #f3c39a; }

/* 便签配色（深） */
:root[data-theme="dark"] .note--yellow { --note-bg: #37301c; --note-edge: #6d5f2e; }
:root[data-theme="dark"] .note--pink   { --note-bg: #392029; --note-edge: #6d3a4c; }
:root[data-theme="dark"] .note--blue   { --note-bg: #1e2b38; --note-edge: #35526b; }
:root[data-theme="dark"] .note--green  { --note-bg: #22301d; --note-edge: #435c35; }
:root[data-theme="dark"] .note--purple { --note-bg: #2c2438; --note-edge: #55446f; }
:root[data-theme="dark"] .note--orange { --note-bg: #37261c; --note-edge: #6d4428; }

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  transition: background 0.25s, color 0.25s;
}

button {
  font-family: inherit;
  border: none;
  background: none;
  cursor: pointer;
  color: inherit;
}

/* ---------- 应用外框 ---------- */
.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 18px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 19px;
  letter-spacing: 0.2px;
  user-select: none;
  flex-shrink: 0;
}
.brand .logo {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  background: linear-gradient(135deg, #ffd36e, #ff8fab);
  display: grid;
  place-items: center;
  font-size: 18px;
  box-shadow: 0 4px 10px rgba(255, 143, 171, 0.35);
}

.search {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 9px;
  max-width: 520px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 9px 14px;
  color: var(--text-soft);
  transition: box-shadow 0.15s;
}
.search:focus-within {
  box-shadow: 0 0 0 3px rgba(255, 143, 171, 0.22);
}
.search input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text);
  font-size: 14px;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  transition: transform 0.12s, background 0.15s;
}
.icon-btn:hover { transform: translateY(-2px); }
.icon-btn:active { transform: scale(0.94); }

.primary-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 16px;
  border-radius: 13px;
  background: linear-gradient(135deg, #ffb05c, #ff7a9e);
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  box-shadow: 0 6px 14px rgba(255, 122, 158, 0.35);
  transition: transform 0.12s, box-shadow 0.15s;
}
.primary-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 122, 158, 0.45); }
.primary-btn:active { transform: scale(0.97); }

/* ---------- 主体布局 ---------- */
.layout {
  flex: 1;
  display: flex;
}

.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  padding: 18px 14px 90px;
  border-right: 1px solid var(--border);
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  gap: 18px;
  overflow-y: auto;
}
@media (max-width: 880px) {
  .sidebar { display: none; }
}

.side-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text-soft);
  text-transform: uppercase;
  padding: 0 8px;
  margin-bottom: 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 10px 12px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-soft);
  text-align: left;
  transition: background 0.15s, color 0.15s;
}
.nav-item .ico { font-size: 16px; width: 20px; text-align: center; }
.nav-item .count {
  margin-left: auto;
  font-size: 11px;
  font-weight: 700;
  background: var(--chip-bg);
  border-radius: 999px;
  padding: 2px 8px;
  color: var(--text-soft);
}
.nav-item:hover { background: var(--chip-bg); color: var(--text); }
.nav-item.active {
  background: linear-gradient(135deg, #ffe9c7, #ffd7e2);
  color: #7a4a2c;
}
[data-theme="dark"] .nav-item.active {
  background: linear-gradient(135deg, #4a3a1c, #4a2a34);
  color: #ffd7a8;
}

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 8px;
}
.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 11px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-soft);
}
.tag-chip .dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
}
.tag-chip:hover { background: var(--chip-bg); color: var(--text); }

/* ---------- 主区（便签墙） ---------- */
.main {
  flex: 1;
  min-width: 0;
  padding: 22px 22px 90px;
}

.main-top {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.main-top h1 {
  font-size: 21px;
  margin: 0;
  font-weight: 800;
}
.main-sub {
  color: var(--text-soft);
  font-size: 13px;
}

.filter-chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-left: auto;
}
.filter-chip {
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-soft);
}
.filter-chip:hover { color: var(--text); }
.filter-chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }

/* 便签墙 grid */
.board {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: var(--gap);
  align-items: start;
}
@media (max-width: 480px) {
  .board { grid-template-columns: 1fr; }
}

/* ---------- 便签卡片 ---------- */
.note {
  --note-bg: var(--surface);
  --note-edge: var(--border);
  position: relative;
  background: var(--note-bg);
  border: 1px solid var(--note-edge);
  border-radius: var(--radius);
  padding: 16px 16px 14px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.18s;
  overflow: hidden;
}
.note:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }

/* 便签纸顶端色带 */
.note::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 5px;
  background: var(--note-edge);
  opacity: 0.85;
}

.note-top {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 5px;
}
.note-due {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--surface);
  color: var(--text-soft);
}
.note-due.overdue { color: #d64545; background: rgba(214, 69, 69, 0.12); }
.note-due.today { color: #c8811a; background: rgba(200, 129, 26, 0.14); }
.note-flag { margin-left: auto; font-size: 14px; opacity: 0.85; }

.note h3 {
  margin: 2px 0 6px;
  font-size: 16px;
  line-height: 1.35;
  font-weight: 750;
}
.note.done h3 { text-decoration: line-through; opacity: 0.55; }

.note .body {
  margin: 0 0 10px;
  font-size: 13.5px;
  line-height: 1.6;
  color: color-mix(in srgb, var(--text) 88%, transparent);
  white-space: pre-wrap;
}

/* 标签 */
.note-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 9px;
}
.note-tags .tag {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--note-edge) 40%, transparent);
}

/* 清单 */
.note-checklist { display: flex; flex-direction: column; gap: 6px; margin-bottom: 9px; }
.check-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  line-height: 1.4;
}
.check-item input { margin-top: 3px; accent-color: #ff7a9e; }
.check-item.done span { text-decoration: line-through; opacity: 0.5; }

/* 底部操作 */
.note-foot {
  display: flex;
  align-items: center;
  gap: 4px;
  padding-top: 9px;
  border-top: 1px dashed color-mix(in srgb, var(--note-edge) 70%, transparent);
}
.note-foot .spacer { flex: 1; }
.mini-btn {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-size: 14px;
  color: color-mix(in srgb, var(--text) 60%, transparent);
  transition: background 0.15s, color 0.15s, transform 0.12s;
}
.mini-btn:hover { background: color-mix(in srgb, var(--note-edge) 40%, transparent); color: var(--text); transform: translateY(-1px); }
.mini-btn.on { color: #ff7a9e; }
.mini-btn.danger:hover { color: #d64545; }

/* 空状态 */
.empty {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 60px 20px;
  text-align: center;
  color: var(--text-soft);
}
.empty .big { font-size: 40px; margin-bottom: 10px; }

/* ---------- 移动端底部导航 ---------- */
.bottomnav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 40;
  display: none;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  padding: 8px 14px calc(8px + env(safe-area-inset-bottom));
  justify-content: space-around;
}
.bottomnav .bn-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-soft);
  padding: 6px 14px;
  border-radius: 12px;
}
.bottomnav .bn-item .ico { font-size: 20px; }
.bottomnav .bn-item.active { color: #ff7a9e; }
.bottomnav .bn-item .fab {
  width: 46px; height: 46px; border-radius: 16px;
  background: linear-gradient(135deg, #ffb05c, #ff7a9e);
  color: #fff; display: grid; place-items: center; font-size: 24px;
  box-shadow: 0 8px 16px rgba(255, 122, 158, 0.4);
}
@media (max-width: 880px) {
  .bottomnav { display: flex; }
}

/* ---------- 弹窗 ---------- */
.modal-mask {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(20, 16, 26, 0.45);
  backdrop-filter: blur(4px);
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-mask.open { display: flex; }
@media (min-width: 640px) {
  .modal-mask { align-items: center; padding: 20px; }
}
.modal {
  width: 100%;
  max-width: 560px;
  max-height: 92vh;
  overflow-y: auto;
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  padding: 22px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
}
@media (min-width: 640px) {
  .modal { border-radius: 22px; }
}
.modal h2 { margin: 0 0 16px; font-size: 18px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--text-soft); margin-bottom: 6px; }
.field input[type="text"],
.field input[type="date"],
.field textarea {
  width: 100%;
  padding: 11px 13px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  outline: none;
  font-family: inherit;
}
.field input:focus, .field textarea:focus { border-color: #ff7a9e; box-shadow: 0 0 0 3px rgba(255, 122, 158, 0.18); }
.field textarea { min-height: 90px; resize: vertical; }
.color-picker { display: flex; gap: 9px; flex-wrap: wrap; }
.color-swatch {
  width: 34px; height: 34px; border-radius: 11px; cursor: pointer;
  border: 2px solid transparent; transition: transform 0.12s;
}
.color-swatch:hover { transform: scale(1.1); }
.color-swatch.sel { border-color: var(--text); }
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 18px;
}
.btn-ghost { padding: 11px 16px; border-radius: 12px; font-weight: 600; color: var(--text-soft); }
.btn-ghost:hover { background: var(--chip-bg); color: var(--text); }

/* toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%) translateY(20px);
  z-index: 60;
  background: var(--text);
  color: var(--bg);
  padding: 11px 18px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 600;
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="app">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="logo">📌</span>
        <span>贴贴便签</span>
      </div>

      <div class="search">
        <span>🔍</span>
        <input id="searchInput" type="text" placeholder="搜索便签、标签…" autocomplete="off" />
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
        <button class="primary-btn" id="newBtn">＋ 新建便签</button>
      </div>
    </header>

    <div class="layout">
      <!-- 侧栏（桌面） -->
      <aside class="sidebar">
        <div>
          <div class="side-title">便签</div>
          <button class="nav-item active" data-nav="all"><span class="ico">🗂️</span>全部便签<span class="count" data-count="all">0</span></button>
          <button class="nav-item" data-nav="todo"><span class="ico">📝</span>进行中<span class="count" data-count="todo">0</span></button>
          <button class="nav-item" data-nav="done"><span class="ico">✅</span>已完成<span class="count" data-count="done">0</span></button>
          <button class="nav-item" data-nav="archived"><span class="ico">📦</span>归档<span class="count" data-count="archived">0</span></button>
        </div>

        <div>
          <div class="side-title">标签</div>
          <div class="tag-row" id="tagList"></div>
        </div>
      </aside>

      <!-- 主区 -->
      <main class="main">
        <div class="main-top">
          <h1 id="heading">全部便签</h1>
          <span class="main-sub" id="countText">0 条</span>
          <div class="filter-chips" id="filterChips">
            <button class="filter-chip" data-sort="time">最新</button>
            <button class="filter-chip" data-sort="due">截止</button>
            <button class="filter-chip active" data-sort="pin">置顶优先</button>
          </div>
        </div>

        <div class="board" id="board">
          <!-- 便签墙：由 JS 渲染 -->
        </div>
      </main>
    </div>

    <!-- 移动端底部导航 -->
    <nav class="bottomnav">
      <button class="bn-item active" data-nav="all"><span class="ico">🗂️</span>全部</button>
      <button class="bn-item" data-nav="todo"><span class="ico">📝</span>待办</button>
      <button class="bn-item" id="newBtnMobile"><span class="fab">＋</span></button>
      <button class="bn-item" data-nav="done"><span class="ico">✅</span>完成</button>
      <button class="bn-item" data-nav="archived"><span class="ico">📦</span>归档</button>
    </nav>
  </div>

  <!-- 编辑弹窗 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <h2 id="modalTitle">新建便签</h2>
      <div class="field">
        <label>标题</label>
        <input type="text" id="fTitle" placeholder="便签标题" />
      </div>
      <div class="field">
        <label>内容</label>
        <textarea id="fContent" placeholder="写点什么…"></textarea>
      </div>
      <div class="field">
        <label>颜色</label>
        <div class="color-picker" id="colorPicker"></div>
      </div>
      <div class="field">
        <label>截止日期</label>
        <input type="date" id="fDue" />
      </div>
      <div class="field">
        <label>标签（用逗号分隔）</label>
        <input type="text" id="fTags" placeholder="工作, 生活" />
      </div>
      <div class="field">
        <label>清单子项（每行一项）</label>
        <textarea id="fChecklist" placeholder="第一件事&#10;第二件事"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelBtn">取消</button>
        <button class="primary-btn" id="saveBtn">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
/* ===== 贴贴便签 · 前端 Demo（mock 数据 + 基础交互） ===== */

const COLORS = [
  { key: "yellow", hex: "#fff6c9" },
  { key: "pink",   hex: "#ffe3ee" },
  { key: "blue",   hex: "#dcefff" },
  { key: "green",  hex: "#e3f6d0" },
  { key: "purple", hex: "#ece3ff" },
  { key: "orange", hex: "#ffe8d3" },
];

let notes = [
  {
    id: "n1", color: "yellow", title: "周末采购清单", done: false, pinned: false, archived: false,
    dueAt: "", tags: ["生活"],
    content: "",
    checklist: [
      { text: "鲜牛奶 2 盒", done: true },
      { text: "鸡蛋 30 个", done: false },
      { text: "咖啡豆", done: false },
      { text: "燕麦片", done: true },
    ],
    createdAt: Date.now() - 5 * 864e5,
    updatedAt: Date.now() - 5 * 864e5,
  },
  {
    id: "n2", color: "pink", title: "健身打卡", done: false, pinned: false, archived: false,
    dueAt: nextDay(1), tags: ["健康", "习惯"],

/* ---------- 状态 ---------- */
let state = { nav: "all", sort: "pin", query: "", tag: null };
let editingId = null; // null = 新建

const $ = (s) => document.querySelector(s);
const board = $("#board");

/* ---------- 工具 ---------- */
function today() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}
function nextDay(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}
function dateLabel(due) {
  if (!due) return null;
  const t = today();
  if (due === t) return { text: "今天", cls: "today" };
  if (due < t) return { text: "已逾期", cls: "overdue" };
  return { text: due, cls: "" };
}
function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

/* ---------- 渲染 ---------- */
function visibleNotes() {
  let list = notes.filter((n) => {
    if (n.archived !== (state.nav === "archived")) return false;
    if (state.nav === "todo" && n.done) return false;
    if (state.nav === "done" && !n.done) return false;
    if (state.tag && !n.tags.includes(state.tag)) return false;
    if (state.query) {
      const q = state.query.toLowerCase();
      const hay = (n.title + " " + n.content + " " + n.tags.join(" ")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const order = { pin: (a, b) => (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt),
    time: (a, b) => b.updatedAt - a.updatedAt,
    due: (a, b) => (a.dueAt || "9999") < (b.dueAt || "9999") ? -1 : 1 };
  list.sort(order[state.sort] || order.pin);
  return list;
}

function noteCard(n) {
  const due = dateLabel(n.dueAt);
  const tags = n.tags.map((t) => `<span class="tag">#${escapeHtml(t)}</span>`).join("");
  const check = n.checklist.length
    ? `<div class="note-checklist">${n.checklist.map((c) =>
        `<label class="check-item ${c.done ? "done" : ""}">
           <input type="checkbox" ${c.done ? "checked" : ""} data-act="check" data-idx="${n.checklist.indexOf(c)}" />
           <span>${escapeHtml(c.text)}</span>
         </label>`).join("")}</div>`
    : "";
  const dueHtml = due
    ? `<span class="note-due ${due.cls}">⏰ ${due.text}</span>`
    : `<span class="note-due" style="visibility:hidden">—</span>`;
  const pin = n.pinned ? "on" : "";
  return `
    <article class="note note--${n.color} ${n.done ? "done" : ""}" data-id="${n.id}">
      <div class="note-top">
        ${dueHtml}
        ${n.pinned ? `<span class="note-flag">📌</span>` : ""}
      </div>
      <h3>${escapeHtml(n.title)}</h3>
      ${n.content ? `<p class="body">${escapeHtml(n.content)}</p>` : ""}
      ${tags ? `<div class="note-tags">${tags}</div>` : ""}
      ${check}
      <div class="note-foot">
        <button class="mini-btn ${pin}" data-act="pin" title="置顶">📌</button>
        <button class="mini-btn ${n.done ? "on" : ""}" data-act="done" title="完成">${n.done ? "✓" : "○"}</button>
        <span class="spacer"></span>
        <button class="mini-btn" data-act="edit" title="编辑">✏️</button>
        ${n.archived
          ? `<button class="mini-btn" data-act="unarchive" title="恢复">↩️</button>
             <button class="mini-btn danger" data-act="del" title="删除">🗑️</button>`
          : `<button class="mini-btn" data-act="archive" title="归档">📦</button>`}
      </div>
    </article>`;
}

function render() {
  // 导航高亮
  document.querySelectorAll("[data-nav]").forEach((el) => {
    el.classList.toggle("active", el.dataset.nav === state.nav);
  });
  // 计数
  document.querySelectorAll("[data-count]").forEach((el) => {
    const key = el.dataset.count;
    let c = 0;
    if (key === "all") c = notes.filter((n) => !n.archived).length;
    else if (key === "todo") c = notes.filter((n) => !n.archived && !n.done).length;
    else if (key === "done") c = notes.filter((n) => !n.archived && n.done).length;
    else if (key === "archived") c = notes.filter((n) => n.archived).length;
    el.textContent = c;
  });
  // 侧栏标签
  const tagSet = new Set();
  notes.forEach((n) => n.tags.forEach((t) => tagSet.add(t)));
  $("#tagList").innerHTML = [...tagSet].map((t) =>
    `<button class="tag-chip ${state.tag === t ? "active" : ""}" data-tag="${escapeHtml(t)}">
       <span class="dot" style="background:var(--note-edge)"></span>${escapeHtml(t)}
     </button>`).join("");

  const names = { all: "全部便签", todo: "进行中", done: "已完成", archived: "归档" };
  $("#heading").textContent = names[state.nav];
  const list = visibleNotes();
  $("#countText").textContent = `${list.length} 条`;
  board.innerHTML = list.length
    ? list.map(noteCard).join("")
    : `<div class="empty"><div class="big">🗒️</div>这里还没有便签</div>`;

  // 排序 chips 高亮
  document.querySelectorAll(".filter-chip").forEach((el) =>
    el.classList.toggle("active", el.dataset.sort === state.sort));
}

/* ---------- 主题 ---------- */
function initTheme() {
  $("#themeBtn").addEventListener("click", () => {
    const root = document.documentElement;
    const next = root.dataset.theme === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    $("#themeBtn").textContent = next === "dark" ? "☀️" : "🌙";
    localStorage.setItem("note-theme", next);
  });
  const saved = localStorage.getItem("note-theme");
  if (saved) {
    document.documentElement.dataset.theme = saved;
    $("#themeBtn").textContent = saved === "dark" ? "☀️" : "🌙";
  }
}

/* ---------- 便签操作 ---------- */
function toggleCheck(note, idx) {
  note.checklist[idx].done = !note.checklist[idx].done;
  note.updatedAt = Date.now();
  render();
}

board.addEventListener("click", (e) => {
  const actBtn = e.target.closest("[data-act]");
  const card = e.target.closest(".note");
  if (!card) return;
  const note = notes.find((n) => n.id === card.dataset.id);
  if (!note) return;

  // 清单勾选区：点击方框或文字不触发打开编辑，交给 change 事件处理
  if (e.target.closest('[data-act="check"]') || e.target.closest(".check-item")) return;

  if (actBtn) {
    e.stopPropagation();
    const act = actBtn.dataset.act;
    if (act === "pin") { note.pinned = !note.pinned; }
    else if (act === "done") { note.done = !note.done; }
    else if (act === "archive") { note.archived = true; }
    else if (act === "unarchive") { note.archived = false; }
    else if (act === "del") {
      notes = notes.filter((n) => n.id !== note.id);
      toast("已删除");
    } else if (act === "edit") { openModal(note); return; }
    note.updatedAt = Date.now();
    render();
    return;
  }
  openModal(note);
});

board.addEventListener("change", (e) => {
  const cb = e.target.closest('input[type="checkbox"]');
  if (!cb || cb.dataset.act !== "check") return;
  const card = e.target.closest(".note");
  const note = notes.find((n) => n.id === card.dataset.id);
  if (!note) return;
  toggleCheck(note, Number(cb.dataset.idx));
});

/* ---------- 搜索 / 筛选 ---------- */
$("#searchInput").addEventListener("input", (e) => { state.query = e.target.value; render(); });

document.querySelectorAll(".filter-chip").forEach((el) =>
  el.addEventListener("click", () => { state.sort = el.dataset.sort; render(); }));

document.querySelectorAll("[data-nav]").forEach((el) =>
  el.addEventListener("click", () => { state.nav = el.dataset.nav; state.tag = null; render(); }));

$("#tagList").addEventListener("click", (e) => {
  const t = e.target.closest("[data-tag]");
  if (!t) return;
  state.tag = state.tag === t.dataset.tag ? null : t.dataset.tag;
  render();
});

$("#newBtn").addEventListener("click", () => openModal(null));
$("#newBtnMobile").addEventListener("click", () => openModal(null));

/* ---------- 弹窗 ---------- */
function renderColorPicker(sel) {
  $("#colorPicker").innerHTML = COLORS.map((c) =>
    `<span class="color-swatch ${c.key === sel ? "sel" : ""}" data-color="${c.key}" style="background:${c.hex}"></span>`).join("");
}
let pickedColor = "yellow";

$("#colorPicker").addEventListener("click", (e) => {
  const sw = e.target.closest("[data-color]");
  if (!sw) return;
  pickedColor = sw.dataset.color;
  renderColorPicker(pickedColor);
});

function openModal(note) {
  editingId = note ? note.id : null;
  const title = $("#modalTitle");
  title.textContent = note ? "编辑便签" : "新建便签";
  $("#fTitle").value = note ? note.title : "";
  $("#fContent").value = note ? note.content : "";
  $("#fDue").value = note ? note.dueAt : "";
  $("#fTags").value = note ? note.tags.join(", ") : "";
  $("#fChecklist").value = note ? note.checklist.map((c) => c.text).join("\n") : "";
  pickedColor = note ? note.color : "yellow";
  renderColorPicker(pickedColor);
  $("#modalMask").classList.add("open");
  $("#fTitle").focus();
}
function closeModal() { $("#modalMask").classList.remove("open"); }

$("#cancelBtn").addEventListener("click", closeModal);
$("#modalMask").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeModal(); });

$("#saveBtn").addEventListener("click", () => {
  const title = $("#fTitle").value.trim() || "无标题";
  const checklist = $("#fChecklist").value.split("\n").map((s) => s.trim()).filter(Boolean)
    .map((text) => ({ text, done: false }));
  const tags = $("#fTags").value.split(/[,，]/).map((s) => s.trim()).filter(Boolean);
  const dueAt = $("#fDue").value;

  if (editingId) {
    const note = notes.find((n) => n.id === editingId);
    note.title = title;
    note.content = $("#fContent").value.trim();
    note.color = pickedColor;
    note.tags = tags;
    note.dueAt = dueAt;
    note.checklist = checklist;
    note.updatedAt = Date.now();
    toast("已保存");
  } else {
    notes.unshift({
      id: "n" + Date.now(), color: pickedColor, title, done: false, pinned: false, archived: false,
      dueAt, tags, content: $("#fContent").value.trim(), checklist,
      createdAt: Date.now(), updatedAt: Date.now(),
    });
    toast("已创建");
  }
  closeModal();
  render();
});

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------- 启动 ---------- */
initTheme();
render();
console.log("%c贴贴便签 Demo 已加载", "color:#ff7a9e;font-weight:bold");
